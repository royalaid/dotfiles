# Ramp MCP tools that change state: payments, transfers, approvals, card,
# fund, bill, reimbursement, travel and profile edits. Classified by name from
# https://agents.ramp.com/docs/mcp/tools on 2026-10-14. Claude Code asks before
# each (private_dot_claude/modify_settings.json). Codex uses
# default_tools_approval_mode = "writes" and OpenCode asks on ramp_* with read
# allows, so a tool Ramp adds later is gated there without this list.
